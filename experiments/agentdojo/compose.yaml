name: agentdojo-examples
services:
  agentdojo:
    image: agentic-sel4/agentdojo:089ed468
    build:
      context: ./.build-context
      dockerfile: Dockerfile
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./results:/results
    cpus: 2
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
